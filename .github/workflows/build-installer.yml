name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Build JAR with Maven
        run: mvn clean package -q

      - name: Copy icon
        run: |
          mkdir -p installer-input
          copy target\AttendanceSystem.jar installer-input\
          copy src\main\resources\app-icon.ico installer-input\

      - name: Create Windows Installer with jpackage
        run: |
          jpackage `
            --type exe `
            --name "QR Attendance System" `
            --vendor "DY Patil School of Biotechnology" `
            --app-version "1.0.0" `
            --description "QR Code Based Attendance Management System" `
            --input installer-input `
            --main-jar AttendanceSystem.jar `
            --main-class com.attendance.Main `
            --icon installer-input\app-icon.ico `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser `
            --win-menu-group "QR Attendance" `
            --dest installer-output `
            --java-options "-Xms256m" `
            --java-options "-Xmx512m"

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Attendance-Installer
          path: installer-output\*.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: installer-output\*.exe
          name: QR Attendance System v1.0.0
          body: |
            ## QR Code Based Attendance Management System
            ### DY Patil School of Biotechnology and Bioinformatics

            **Installation:**
            1. Download QR-Attendance-Setup.exe
            2. Run the installer
            3. Launch from Desktop shortcut

            **Login:**
            - Teacher: EMP001 / Teacher@123
