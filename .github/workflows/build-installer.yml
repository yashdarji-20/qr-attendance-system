name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build JAR with Maven
        run: mvn clean package -q

      - name: Prepare installer input
        run: |
          New-Item -ItemType Directory -Force -Path installer-input | Out-Null
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          Copy-Item target\AttendanceSystem.jar installer-input\
          if (Test-Path src\main\resources\app-icon.ico) {
            Copy-Item src\main\resources\app-icon.ico installer-input\
          }
        shell: pwsh

      - name: Create Windows Installer
        run: |
          $iconArg = ""
          if (Test-Path installer-input\app-icon.ico) {
            $iconArg = "--icon installer-input\app-icon.ico"
          }
          jpackage `
            --type exe `
            --name "QR Attendance System" `
            --vendor "DY Patil School of Biotechnology" `
            --app-version "1.0.0" `
            --description "QR Code Based Attendance Management System" `
            --input installer-input `
            --main-jar AttendanceSystem.jar `
            --main-class com.attendance.Main `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser `
            --win-menu-group "QR Attendance" `
            --dest installer-output `
            --java-options "-Xms256m" `
            --java-options "-Xmx512m"
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: QR-Attendance-Installer
          path: installer-output\*.exe
          retention-days: 30
